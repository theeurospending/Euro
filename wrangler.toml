name = "eurospending"
main = "cf-worker.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
account_id = "6cf68960b27daab8958759fa184ad9e4"

[observability]
enabled = true

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

# Self-reference for OpenNext incremental cache revalidation.
# Service name MUST match `name` above.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "eurospending"

# Cron triggers.
# NOTE: dropped the no-op quarterly slot to make room for */15-min publish cron;
# quarterly hooks will return when Eurostat quarterly extractors land (Session 13).
[triggers]
crons = [
  "0 6 * * *",     # daily 06:00 UTC — ECB policy rates, FX
  "0 7 * * 1",     # weekly Mon 07:00 UTC — ECB balance sheet
  "0 8 1 * *",     # monthly 1st 08:00 UTC — money supply, HICP, sovereign yields
  "0 10 1 3 *",    # annual 1 March 10:00 UTC — full Eurostat + IMF WEO refresh
  "*/15 * * * *",  # every 15 min — scheduled publish (blog now; social in Session 10)
]
